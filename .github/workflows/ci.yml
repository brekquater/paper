name: CI

# Quality gates for every push to master and every pull request: `cargo xtask ci` (fmt, clippy,
# tests, catalogs, doctests, asset attribution, layering, wasm check).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to master runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRAFT_I18N_DIR: ${{ github.workspace }}/../craft-i18n
      CRAFT_FONTS_DIR: ${{ github.workspace }}/../craft-fonts
    steps:
      - uses: actions/checkout@v4
      - name: Build inputs (translations, language data, interface fonts)
        run: |
          git clone --filter=blob:none https://github.com/storytold/craft-i18n "$CRAFT_I18N_DIR"
          git -C "$CRAFT_I18N_DIR" checkout "$(cat craft-i18n.rev)"
          git clone --filter=blob:none https://github.com/storytold/craft-fonts "$CRAFT_FONTS_DIR"
          git -C "$CRAFT_FONTS_DIR" checkout b076417b5880bd4154bd22f00695b1d28c6bea83
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: cargo xtask ci
        run: cargo xtask ci
