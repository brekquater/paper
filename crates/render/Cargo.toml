[package]
name = "paper-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Paper rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
paper-geom = { workspace = true, features = ["image"] }
paper-doc = { workspace = true }
paper-fonts = { workspace = true }
paper-layout = { workspace = true }
craft-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
